<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Rank</title>
<meta name="description" content="Rank AI models and coding harnesses your way, then export the board as a PNG.">
<meta property="og:title" content="My AI Rank">
<meta property="og:description" content="Rank AI models and coding harnesses your way, then export the board as a PNG.">
<link rel="icon" href="assets/img/logo.png" type="image/png">
<script src="tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#0b0b0c',
        raise: '#121214',
        ink: '#f0ede6',
        muted: '#8a8781',
        accent: '#c6ff3e',
        line: 'rgba(240, 237, 230, 0.14)',
        linestrong: 'rgba(240, 237, 230, 0.32)'
      },
      fontFamily: {
        display: ['Archivo', 'Helvetica Neue', 'Arial', 'sans-serif'],
        mono: ['JetBrains Mono', 'SF Mono', 'Menlo', 'monospace']
      }
    }
  }
};
</script>
<link rel="stylesheet" href="styles.css">
<script src="html2canvas.min.js"></script>
<script src="app.js" defer></script>
</head>
<body class="bg-bg text-ink font-display antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 flex items-center justify-between h-[58px] px-5 sm:px-8 border-b border-line bg-bg/90 backdrop-blur">
    <a class="flex items-center gap-2.5" href="./" aria-label="My AI Rank — home">
      <img src="assets/img/logo.png" alt="My AI Rank logo" width="26" height="26" class="rounded-md">
      <span class="font-mono text-[0.85rem] font-medium tracking-[0.02em]">My&nbsp;AI&nbsp;Rank</span>
    </a>
    <a class="flex items-center gap-2 font-mono text-[0.8rem] tracking-[0.02em] text-muted hover:text-accent transition-colors" href="https://x.com/xueyu1125" target="_blank" rel="noopener">
      <img src="assets/img/x.svg" alt="" width="13" height="13"><span>@xueyu1125&nbsp;↗</span>
    </a>
  </header>

  <main class="flex-1 w-full max-w-[1360px] mx-auto px-5 sm:px-8 pt-8 pb-12">
    <div class="flex flex-wrap items-end justify-between gap-6 mb-6">
      <div class="min-w-0">
        <h1 class="font-display font-extrabold uppercase leading-[0.95] tracking-tight [font-stretch:125%] text-[clamp(2rem,5vw,3.6rem)] mb-2.5">My AI Rank</h1>
        <p class="font-mono text-[0.8rem] tracking-[0.02em] text-muted">Drag the cards into tiers, then export your ranking as a PNG.</p>
<div class="mode-switch" role="tablist" aria-label="Ranking mode">
          <button class="mode-tab active" data-mode="models" role="tab" aria-selected="true" type="button">Models</button>
          <button class="mode-tab" data-mode="harnesses" role="tab" aria-selected="false" type="button">Harnesses</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <input id="name" class="tl-input" type="text" placeholder="Your name">
        <input id="handle" class="tl-input" type="text" placeholder="@xhandle">
        <button id="btn-reset" class="px-4 py-2.5 font-mono text-[0.8rem] tracking-[0.02em] border border-linestrong rounded-sm text-ink hover:border-accent hover:text-accent transition-colors" type="button">Reset</button>
        <button id="btn-export" class="px-4 py-2.5 font-mono text-[0.8rem] tracking-[0.02em] rounded-sm bg-accent text-[#0b0b0c] font-medium hover:bg-[#d8ff70] transition-colors" type="button">Download PNG</button>
        <button id="btn-copy" class="px-4 py-2.5 font-mono text-[0.8rem] tracking-[0.02em] border border-linestrong rounded-sm text-ink hover:border-accent hover:text-accent transition-colors" type="button">Copy PNG</button>
      </div>
      <div id="status" class="tl-status w-full text-right"></div>
    </div>

    <div class="grid grid-cols-1 gap-6 items-start">
      <div id="tier-board" class="tier-board">
        <div class="board-header">
          <div>
            <h2 class="board-title" id="board-title">AI Model Rank</h2>
            <div id="board-meta" class="board-meta">
              <span class="screen-only" id="board-meta-drag">Drag a model card into a tier • </span><span class="png-only" id="board-brand-png">My AI Rank</span><span class="screen-only" id="board-brand">My AI Rank</span>
            </div>
          </div>
          <div id="board-author" class="board-author"></div>
        </div>
        <div id="tier-rows"></div>
        <div class="board-footer">
          <span class="screen-only" id="board-foot-brand"><a href="https://airank.dinosaurliu.com/" target="_blank" rel="noopener">airank.dinosaurliu.com</a></span>
          <span class="tl-footer-note png-only" id="board-foot-note">
            <span id="board-foot-note-text">made with airank.dinosaurliu.com</span>
          </span>
        </div>
      </div>

      <aside class="model-pool">
        <div class="pool-head">
          <h3 class="pool-title" id="pool-title">Models</h3>
          <span id="pool-count" class="pool-count">0</span>
        </div>
        <div id="pool-list" class="pool-list"></div>
        <form id="add-form" class="tl-add">
          <input id="new-model" class="tl-input" type="text" placeholder="Add a new model…" required autocomplete="off">
          <select id="new-provider" class="tl-select"></select>
          <button type="submit" class="px-4 py-2.5 font-mono text-[0.8rem] tracking-[0.02em] border border-linestrong rounded-sm text-ink hover:border-accent hover:text-accent transition-colors">Add</button>
        </form>
      </aside>
    </div>
  </main>

  <footer class="border-t border-line">
    <div class="w-full max-w-[1360px] mx-auto px-5 sm:px-8 py-5 flex flex-wrap items-center justify-between gap-3 font-mono text-[0.78rem] tracking-[0.02em] text-muted">
      <a class="flex items-center gap-2 hover:text-ink transition-colors" href="./">
        <img src="assets/img/logo.png" alt="My AI Rank logo" width="20" height="20" class="rounded">
        <span>My AI Rank</span>
      </a>
      <a class="hover:text-accent transition-colors" href="https://x.com/xueyu1125" target="_blank" rel="noopener">X · @xueyu1125</a>
      <span>© 2026 My AI Rank</span>
    </div>
  </footer>
</body>
</html>
